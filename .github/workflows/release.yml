name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build clean installation archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          files = ['app_container.py', 'browser_lifecycle.py', 'browser_profiles.py', 'chrome_mobile.py', 'chrome_transport.py', 'happ_memory.py', 'proxy_manager.py', 'proxy_network.py', 'userscript_privacy.py', 'userscripts.py', 'vpn_dispatcher.py', 'vpn_runtime.py', 'userscript_privacy.js', 'userscript_runtime.js', 'userscript_transform.js', 'vendor/acorn.js', 'vendor/acorn.LICENSE', 'Запустить_Мультибот.bat', 'README.md']
          assert [name for name in files if name.endswith('.bat')] == ['Запустить_Мультибот.bat']
          with zipfile.ZipFile('LegionMultiBot-windows.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  if not Path(name).is_file():
                      raise FileNotFoundError(name)
                  archive.write(name, 'LegionMultiBot/' + name)
          PY
          sha256sum LegionMultiBot-windows.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LegionMultiBot $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            LegionMultiBot-windows.zip SHA256SUMS.txt
