name: Publish standalone Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up build Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check repository for private data
        run: python -B scripts/check_repository.py --history
      - name: Install build tool
        run: python -m pip install pyinstaller==6.22.3
      - name: Run application tests
        env:
          LEGION_DATA_DIR: ${{ runner.temp }}/legion-tests-state
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'legion-python-tests.log'
          python -B -m unittest discover -s tests *> $testLog
          $testExit = $LASTEXITCODE
          Get-Content -LiteralPath $testLog | Select-Object -Last 45
          if ($testExit -ne 0) {
            $detail = (Get-Content -LiteralPath $testLog -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Python test failure::$detail"
            exit $testExit
          }
          $testLog = Join-Path $env:RUNNER_TEMP 'legion-node-tests.log'
          node --test tests/*.test.js *> $testLog
          $testExit = $LASTEXITCODE
          Get-Content -LiteralPath $testLog | Select-Object -Last 30
          if ($testExit -ne 0) {
            $detail = (Get-Content -LiteralPath $testLog -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=JavaScript test failure::$detail"
            exit $testExit
          }
      - name: Build and verify standalone archive
        run: python .github/build_portable.py --output dist
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "LegionMultiBot $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md dist/LegionMultiBot-windows.zip dist/legion-multibot.zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
