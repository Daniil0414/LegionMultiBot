name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build clean installation archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('LegionMultiBot-windows.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  if not name or name.startswith('.github/') or name in ('.gitignore', '.gitattributes', 'RELEASE_NOTES.md'):
                      continue
                  archive.write(name, 'LegionMultiBot/' + name)
          PY
          sha256sum LegionMultiBot-windows.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LegionMultiBot $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            LegionMultiBot-windows.zip SHA256SUMS.txt
